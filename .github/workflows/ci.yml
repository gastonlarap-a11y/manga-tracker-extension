name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans the whole history

      # extension-key.pem is only kept out of git by .gitignore — this is the net.
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false # PR comments would need pull-requests: write

      # Pinned to the Bun the desktop release bundles (its sources.json), so
      # what CI proves is what ships rather than whatever is newest today.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # Vitest runs on Node, and Vitest 5 needs 22.12 or later: pinned rather
      # than left to whatever the runner image has.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # postinstall runs `wxt prepare`, generating the .wxt/ types typecheck needs
      - run: bun install --frozen-lockfile

      - run: bun run lint

      - run: bun run typecheck

      - run: bun run test

      # The package is what reaches people, and nothing above builds it: a
      # manifest error or a bundling failure used to surface only at upload.
      - run: bun run build

      # The store zip must not declare `key` — the Web Store rejects an upload
      # that does — and must keep the permissions the privacy docs justify.
      - name: Check the store package
        run: |
          set -euo pipefail
          bun run zip:store
          zip=$(ls .output/*-chrome.zip | sort -V | tail -1)
          unzip -p "$zip" manifest.json > store-manifest.json
          bun -e '
            const m = await Bun.file("store-manifest.json").json();
            if ("key" in m) throw new Error("the store manifest declares key");
            console.log(`store package ok: ${m.version}, ${m.host_permissions.length} host patterns`);
          '
